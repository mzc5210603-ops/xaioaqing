<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>石板讲台 SLATE BOARD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="classroom">
  <div class="board-frame">
    <div class="chalk-tray" id="chalkTray"></div>
    <div class="board" id="board">
      <header class="board-head">
        <p class="kicker">SLATE BOARD · 数学问询处</p>
        <h1>石板讲台</h1>
        <p class="lead">数学问题写上来，粉笔字答在黑板上。</p>
      </header>
      <div class="board-body" id="boardBody"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
